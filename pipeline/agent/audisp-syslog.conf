# The auditd dispatcher plugin that puts audit events onto syslog.
#
# Install as /etc/audit/plugins.d/syslog.conf. The file is shipped by the
# audispd-plugins package with "active = no" and "args = LOG_INFO", and
# host-baseline/roles/auditd manages those two lines rather than replacing the
# file, so this copy is here as the reference for what the whole file should look
# like and what each field costs.
#
# Both lines matter. With "active = no" nothing leaves the host at all; with an
# args line that names no facility, audisp-syslog never calls openlog() and every
# event arrives on the default facility of "user", which is not the facility
# ../variables.tf collects and not the one the queries were written against.
#
# Without this plugin, auditd writes /var/log/audit/audit.log and nothing else.
# The log stays on the host, which is the one place somebody with root can edit
# it, and the queries in ../queries/ have nothing to read.

# The switch. host-baseline/roles/auditd sets this from
# auditd_forward_to_syslog.
active = yes

# out means auditd feeds the plugin. There is no other useful value here.
direction = out

path = /sbin/audisp-syslog
type = always

# The syslog facility events are written to, and the reason local6 appears in
# syslog_facilities in ../variables.tf. Sending audit events to authpriv works
# and mixes them with every PAM and sshd message, which makes both harder to
# filter; a facility of their own is worth the one line of configuration.
#
# The second argument is the priority. info is right: auditd events are not
# errors, and writing them at a higher priority puts them in front of things
# that are.
args = LOG_LOCAL6 LOG_INFO

format = string
