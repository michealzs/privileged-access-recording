# Collector side of the forward that host-baseline/roles/tlog configures.
#
# The hosts send; this receives. Install it on the collector as
# /etc/rsyslog.d/40-recorded-access-collector.conf. It is a plain file rather
# than an Ansible template because the collector is one host and templating a
# single file hides what it does.
#
# What this file is responsible for: terminating the TLS the hosts insist on,
# writing each sender's stream to its own file, leaving the received messages in
# the default ruleset so the Azure Monitor Agent picks them up, and not rate
# limiting any of it.
#
# The 40 in the file name is load bearing, for the same reason it is on the
# sending host. The Azure Monitor Agent installs its own drop-in under
# /etc/rsyslog.d/ numbered 10, holding a catch-all action in the default ruleset.
# rsyslog evaluates the default ruleset in configuration order, so with this file
# numbered 40 the agent's action has already run by the time the "stop" below is
# reached, and the received messages stay out of the collector's own
# /var/log/messages.

# TLS. The hosts send to port 6514 with StreamDriverAuthMode x509/name, so they
# check this certificate against tlog_forward_tls_permitted_peer. A self signed
# certificate here means every host silently stops forwarding.
global(
  defaultNetstreamDriver="gtls"
  defaultNetstreamDriverCAFile="/etc/pki/tls/certs/example-collector-ca.pem"
  defaultNetstreamDriverCertFile="/etc/pki/tls/certs/example-collector.pem"
  defaultNetstreamDriverKeyFile="/etc/pki/tls/private/example-collector.key"
)

# Rate limiting on the receiver drops recorded sessions in bursts, which loses
# the middle of a recording and reports nothing. The sending side already
# disables its own limits; this is the same decision one hop later.
#
# PermittedPeer is the only authentication control in front of the second,
# independent copy of the evidence, so it names the sending hosts rather than a
# wildcard. A wildcard means any host holding any certificate from the trusted
# certificate authority may write to the evidence store, which on an estate with
# one internal certificate authority is every host on it. The two ways to keep
# this list honest: enumerate the senders here, or issue collector-client
# certificates from a certificate authority that signs nothing else and point
# defaultNetstreamDriverCAFile at that one.
module(
  load="imtcp"
  StreamDriver.Name="gtls"
  StreamDriver.Mode="1"
  StreamDriver.AuthMode="x509/name"
  PermittedPeer=[
    "example-app-01.internal.example.com",
    "example-app-02.internal.example.com",
    "example-db-01.internal.example.com"
  ]
  MaxSessions="500"
  RateLimit.Interval="0"
  RateLimit.Burst="0"
)

# No ruleset= on this input, on purpose. A message bound to a custom ruleset
# never reaches the default ruleset, and the default ruleset is where the Azure
# Monitor Agent's drop-in lives, so binding the input to a ruleset of its own
# gives a collector with full local files and an empty workspace. The input is
# named instead, and the file action below selects on that name.
input(type="imtcp" port="6514" name="recorded-access")

# One directory per sender, keyed off the address the connection came from rather
# than off the hostname in the message. %HOSTNAME% is chosen by the sender, so a
# compromised host can put another host's name in its messages; %FROMHOST-IP% is
# taken from the connection and cannot be set by the message. It does not make the
# record trustworthy, because the Computer column in the workspace still comes
# from the message, but it does stop one host writing into another host's files.
# See ../../docs/threat-model.md.
template(name="perSenderFile" type="string"
         string="/var/log/recorded-access/%FROMHOST-IP%/%$YEAR%-%$MONTH%-%$DAY%.log")

if ($inputname == "recorded-access") then {
  # Session recordings are the contents of privileged terminals. The directory
  # they land in is not world readable.
  action(
    type="omfile"
    dynaFile="perSenderFile"
    dirCreateMode="0700"
    fileCreateMode="0600"
    dynaFileCacheSize="200"
    ioBufferSize="64k"
    flushOnTXEnd="off"
    asyncWriting="on"
  )

  # Nothing else on the collector needs these. By the time this is reached the
  # agent's own action has already taken a copy, because of the file numbering
  # explained at the top.
  stop
}
