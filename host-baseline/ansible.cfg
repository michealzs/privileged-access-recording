[defaults]
inventory = inventory/example/hosts.yml
roles_path = roles
collections_path = .collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
interpreter_python = auto_silent
forks = 20
timeout = 30
retry_files_enabled = False
nocows = True
deprecation_warnings = True

# Facts are cached on disk for an hour so repeated runs and --check runs do not
# pay for fact gathering on every host.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 3600

# Readable output. --diff shows what changed in every templated file, which on
# these roles is the whole point of a dry run.
stdout_callback = default
callback_result_format = yaml
callback_format_pretty = True
display_skipped_hosts = False

# Static string on purpose: a timestamp here would make every run report a
# change, and every audited file on the host would show a modification.
ansible_managed = This file is managed by Ansible (privileged-access-recording). Manual changes will be overwritten.

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
control_path_dir = ~/.ansible/cp

[diff]
always = False
context = 3
