---
- name: Prepare
  hosts: all
  become: true
  # Facts are required, not optional. The dnf action plugin picks its backend
  # from ansible_facts.pkg_mgr, so with gather_facts off it cannot tell dnf4
  # from dnf5 and fails with "Could not detect which major revision of dnf is
  # in use" before installing anything.
  gather_facts: true
  tasks:
    # The images ship a minimal package set. These are pulled in by the roles
    # themselves on a real host, and installing them here keeps a dependency
    # resolution failure out of the converge step where it would be reported as
    # a role failure.
    - name: Install the packages the roles expect to already be resolvable
      ansible.builtin.dnf:
        name:
          - sudo
          - util-linux
          - python3
        state: present
