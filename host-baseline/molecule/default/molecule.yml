---
# Run with MOLECULE_DISTRO=rockylinux9|rockylinux8 (default rockylinux9).
#
# What this scenario can and cannot prove is worth being explicit about, because
# two of the four roles configure things a container does not have:
#
#   proved     every file is rendered, has the right owner and mode, parses, and
#              a second run reports no change.
#   not proved anything that needs the kernel audit socket or a real directory:
#              auditd loading the rules, sssd authenticating a directory user,
#              tlog actually substituting a shell, pam_tty_audit capturing a
#              keystroke.
#
# The services are therefore left unmanaged here, and the roles have variables
# for that rather than the scenario reaching around them.

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: recorded-${MOLECULE_DISTRO:-rockylinux9}
    image: geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: auto_silent
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
