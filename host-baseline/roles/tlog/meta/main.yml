---
galaxy_info:
  role_name: tlog
  namespace: michealzs
  author: Micheal
  description: Records terminal input and output for named directory groups with tlog, and forwards the recordings to a remote collector.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    # EL8 needs python39 installed and ansible_python_interpreter pointed at it,
    # because its system Python 3.6 is below what ansible-core 2.17 targets.
    - name: EL
      versions:
        - "8"
        - "9"
  galaxy_tags:
    - tlog
    - audit
    - recording
    - security

dependencies: []
