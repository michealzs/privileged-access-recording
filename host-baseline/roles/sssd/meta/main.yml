---
galaxy_info:
  role_name: sssd
  namespace: michealzs
  author: Micheal
  description: Joins a host to an enterprise directory with sssd, restricts login to named groups and grants sudo to a subset of them.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    # EL8 needs python39 installed and ansible_python_interpreter pointed at it,
    # because its system Python 3.6 is below what ansible-core 2.17 targets.
    - name: EL
      versions:
        - "8"
        - "9"
  galaxy_tags:
    - sssd
    - identity
    - authentication
    - security

dependencies: []
