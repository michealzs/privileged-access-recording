---
# Example inventory. Copy this directory to inventory/<environment>/ and replace
# the hosts. Nothing here names a real host.
#
# recorded_hosts is the group site.yml applies to. Everything reached through a
# gateway belongs in it; a host that is not in it is a host with no session
# recording and no audit trail, which is the gap worth checking for.

all:
  children:
    recorded_hosts:
      children:
        application_hosts:
          hosts:
            app-01.internal.example.com:
            app-02.internal.example.com:
        database_hosts:
          hosts:
            db-01.internal.example.com:
